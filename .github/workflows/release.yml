name: Publish Packages

on:
    workflow_dispatch:
    push:
        tags:
            - 'v*.*.*' # Match version tags like v1.0.0

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
        
            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: '9.x'
        
            - name: Restore dependencies
              run: dotnet restore InfiniLore.slnx
        
            - name: Build
              run: dotnet build InfiniLore.slnx --configuration Release --no-restore
                
            - name: Run tests
              run: dotnet test InfiniLore.slnx --configuration Release --no-restore --no-build
        
            - name: Publish to NuGet
              env:
                NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
              run: |          
                  dotnet nuget push src/server/InfiniLore.Server.Types/bin/Release/*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate